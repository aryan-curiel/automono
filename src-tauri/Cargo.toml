[package]
name = "automono"
version = "1.1.0"
description = "Invoicing, expenses and quarterly tax summaries for Spanish freelancers (autónomos)"
authors = ["Aryan Curiel"]
license = "AGPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "automono_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
genpdf = { version = "0.2.0", features = ["images"] }
pdf-extract = "0.7"
rig = { version = "0.41", features = ["derive", "image", "pdf"] }
keyring = { version = "3", features = ["apple-native"] }
schemars = "1.0"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Stripping proc-macro dylibs (sqlx-macros) breaks them on newer macOS linkers
# ("mis-aligned LINKEDIT string pool"). Only build-time code; the app binary is still stripped.
[profile.release.build-override]
strip = false
