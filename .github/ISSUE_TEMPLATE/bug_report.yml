name: Bug report
description: Something doesn't work or a figure looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Don't attach real invoices, receipts, NIF/NIE numbers or client data.** Use made-up examples.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Facturas
        2. ...
  - type: input
    id: version
    attributes:
      label: AutoMono version
      description: Ajustes → General → Acerca de
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
